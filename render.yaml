# Despliegue en Render (plan gratuito) con el Dockerfile del proyecto.
# En Render: New > Blueprint > este repositorio, o el enlace "Deploy to Render" del README.
services:
  - type: web
    name: marea
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Contacto para los servicios de notificaciones push (Google, Apple, Mozilla).
      - key: VAPID_SUBJECT
        value: https://github.com/olopezr/marea
      # Avisos en las apps nativas: se rellenan en el panel de Render (ver .env.example).
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        value: es.marea.app
      - key: APNS_SANDBOX
        value: "false"
      - key: FCM_SERVICE_ACCOUNT
        sync: false
