# Proyecto Xcode generado con XcodeGen: `brew install xcodegen && cd ios && xcodegen`
name: Marea
options:
  bundleIdPrefix: es.marea
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Marea:
    type: application
    platform: iOS
    sources:
      - path: Marea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.marea.app
        PRODUCT_NAME: Marea
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Marea/App/Marea.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Marea/App/Info.plist
      configs:
        Debug:
          MAREA_API_BASE: "http://localhost:8080"
        Release:
          # Cambia esta URL por la de tu servidor en producción.
          MAREA_API_BASE: "https://marea.onrender.com"
  MareaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MareaTests
    dependencies:
      - target: Marea
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: es.marea.app.tests
schemes:
  Marea:
    build:
      targets:
        Marea: all
        MareaTests: [test]
    test:
      targets:
        - MareaTests
