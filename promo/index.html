<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marea · vídeo</title>
  <!-- Fuentes y estilos de la propia app: las pantallas del móvil usan sus mismas clases. -->
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/promo/promo.css">
</head>
<body>
  <div id="stage">
    <div id="bg">
      <div class="p-glow g1"></div><div class="p-glow g2"></div><div class="p-glow g3"></div>
      <svg id="bg-lines" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
    <div id="scenes"></div>
    <div id="phone-layer"></div>
    <div id="pop-layer"></div>
    <div id="fx-layer"></div>
    <div id="vignette"></div>
    <div id="grain"></div>
  </div>
  <div id="controls" hidden>
    <button id="play" type="button">▶︎</button>
    <input id="scrub" type="range" min="0" max="60" step="0.01" value="0">
    <output id="clock">0.00</output>
  </div>
  <script src="/promo/node_modules/gsap/dist/gsap.min.js"></script>
  <script src="/promo/node_modules/gsap/dist/SplitText.min.js"></script>
  <script src="/promo/node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
  <script src="/promo/node_modules/gsap/dist/CustomEase.min.js"></script>
  <script src="/promo/assets/map.js"></script>
  <script type="module" src="/promo/js/main.js"></script>
</body>
</html>
