name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Sync & Tests (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

      - name: Code style & Lint check
        run: |
          npm run lint
          npm run format:check

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Verify i18n strings are in sync
        run: |
          node scripts/i18n.mjs
          git diff --exit-code

      - name: Verify native spots are in sync
        run: |
          node scripts/export-spots.mjs
          git diff --exit-code

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: marea:latest

  android:
    name: Android (compila, tests y lint)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar, tests unitarios y lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

  ios:
    name: iOS (compila la app y el widget)
    # Los minutos de macOS cuentan diez veces: solo en la rama principal y en pull requests.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Generar el proyecto
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Compilar para el simulador
        working-directory: ios
        run: xcodebuild -project Marea.xcodeproj -scheme Marea -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  deploy:
    name: Despliegue en Render
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::El secreto RENDER_DEPLOY_HOOK no está configurado."
            exit 1
          fi
          echo "Disparando despliegue en Render..."
          curl -f -s -S -X POST "$RENDER_DEPLOY_HOOK"
