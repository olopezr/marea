name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint, Sync & Tests (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Code style & Lint check
        run: |
          npm run lint
          npm run format:check

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Verify i18n strings are in sync
        run: |
          node scripts/i18n.mjs
          git diff --exit-code

      - name: Verify native spots are in sync
        run: |
          node scripts/export-spots.mjs
          git diff --exit-code

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: marea:latest
