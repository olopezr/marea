# El plan gratuito de Render duerme el servidor tras 15 min sin visitas y tarda en despertar.
# Una visita cada 10 min lo mantiene activo (750 h gratis al mes cubren un servicio 24/7).
name: Mantener despierto el servidor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://marea.onrender.com/api/health
